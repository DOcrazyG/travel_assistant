[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "travel-assistant"
version = "0.1.0"
description = "Production-oriented backend foundation for a travel assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<0.120",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langsmith>=0.3,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlmodel>=0.0.24,<1",
    "uvicorn[standard]>=0.30,<1",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "redis>=5.2,<7",
]

[project.scripts]
travel-assistant = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pyright>=1.1,<2",
    "pytest>=8.0,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
