services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-travel_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-travel_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
